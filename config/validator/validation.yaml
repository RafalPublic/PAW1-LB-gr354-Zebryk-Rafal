App\Entity\Location:
    properties:
        latitude:
            - Range:
                  min: -90
                  max: 90
                  notInRangeMessage: 'This value should be between -90 and 90.'
                  groups: ['create', 'edit']
        longitude:
            - Range:
                  min: -180
                  max: 180
                  notInRangeMessage: 'This value should be between -180 and 180.'
                  groups: ['create', 'edit']

App\Entity\Measurement:
    properties:
        celsius:
            - Range:
                  max: 40
                  notInRangeMessage: 'Wartość musi być mniejsza lub równa 40.'
                  groups: ['create', 'edit']
